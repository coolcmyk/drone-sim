[supervisord]
nodaemon=true
logfile=/var/log/drone-sim/supervisord.log
pidfile=/run/drone-sim/supervisord.pid
childlogdir=/var/log/drone-sim

[program:unreal]
command=/usr/sbin/runuser -u ue4 -- /bin/bash -lc '/home/ue4/UnrealEngine/Engine/Binaries/Linux/UnrealEditor /opt/Cosys-AirSim/Unreal/Environments/Blocks/Blocks.uproject -game -RenderOffScreen -nosound -unattended -stdout -settings=/opt/drone-sim/settings.json'
priority=10
autorestart=false
startsecs=5
stdout_logfile=/var/log/drone-sim/unreal.log
redirect_stderr=true

[program:xrce]
command=/bin/bash -lc 'source /opt/ros/jazzy/setup.bash && exec /usr/local/bin/MicroXRCEAgent udp4 -p 8888'
priority=20
autorestart=true
startsecs=2
stdout_logfile=/var/log/drone-sim/xrce.log
redirect_stderr=true

[program:qgc]
command=/usr/local/bin/qgc-entrypoint.sh
priority=30
autorestart=false
startsecs=5
stdout_logfile=/var/log/drone-sim/qgc.log
redirect_stderr=true

[program:px4]
command=/usr/local/bin/drone-sim-start-px4
priority=40
autorestart=false
startsecs=5
stdout_logfile=/var/log/drone-sim/px4.log
redirect_stderr=true

[program:readiness]
command=/usr/local/bin/drone-sim-readiness
priority=50
autorestart=false
startretries=0
startsecs=0
stdout_logfile=/var/log/drone-sim/readiness.log
redirect_stderr=true
